<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音直播监控控制台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
.container { max-width: 800px; margin: 0 auto; padding: 20px; }

.header { text-align: center; padding: 30px 0; }
.header h1 { font-size: 24px; color: #fff; margin-bottom: 8px; }
.header .subtitle { color: #888; font-size: 14px; }

.status-card { background: #1a1a2e; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #2a2a4a; }
.status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.status-label { color: #888; font-size: 14px; }
.status-value { font-size: 18px; font-weight: 600; }
.status-running { color: #4ade80; }
.status-stopped { color: #f87171; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.stat { background: #1a1a2e; border-radius: 10px; padding: 16px; text-align: center; border: 1px solid #2a2a4a; }
.stat .num { font-size: 28px; font-weight: 700; color: #818cf8; }
.stat .label { font-size: 12px; color: #888; margin-top: 4px; }

.btn-group { display: flex; gap: 12px; margin-bottom: 20px; }
.btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-start { background: #4ade80; color: #000; }
.btn-start:hover:not(:disabled) { background: #22c55e; }
.btn-stop { background: #f87171; color: #000; }
.btn-stop:hover:not(:disabled) { background: #ef4444; }

.log-box { background: #1a1a2e; border-radius: 12px; border: 1px solid #2a2a4a; overflow: hidden; }
.log-header { padding: 12px 16px; background: #252545; font-size: 14px; font-weight: 600; color: #888; }
.log-content { height: 300px; overflow-y: auto; padding: 12px 16px; font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; line-height: 1.6; }
.log-entry { margin-bottom: 4px; }
.log-time { color: #666; margin-right: 8px; }
.log-msg { color: #ccc; }

.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
.pulse-green { background: #4ade80; }
.pulse-red { background: #f87171; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎙️ 抖音直播监控控制台</h1>
    <div class="subtitle">实时语音识别 · AI 内容总结 · 飞书推送</div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">运行状态</span>
      <span class="status-value" id="statusText">
        <span class="pulse pulse-red"></span>已停止
      </span>
    </div>
    <div class="status-row">
      <span class="status-label">运行时长</span>
      <span class="status-value" id="elapsed">0 分钟</span>
    </div>
    <div class="status-row">
      <span class="status-label">总结间隔</span>
      <span class="status-value" id="interval">-</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="num" id="transcriptCount">0</div>
      <div class="label">识别片段</div>
    </div>
    <div class="stat">
      <div class="num" id="summaryCount">0</div>
      <div class="label">总结次数</div>
    </div>
    <div class="stat">
      <div class="num" id="logCount">0</div>
      <div class="label">日志条数</div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn btn-start" id="btnStart" onclick="startMonitor()">▶ 开始监控</button>
    <button class="btn btn-stop" id="btnStop" onclick="stopMonitor()" disabled>■ 结束监控</button>
  </div>

  <div class="log-box">
    <div class="log-header">📋 实时日志</div>
    <div class="log-content" id="logContent"></div>
  </div>
</div>

<script>
let polling = null;

async function startMonitor() {
  document.getElementById('btnStart').disabled = true;
  const res = await fetch('/api/start', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({}) });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('btnStop').disabled = false;
    startPolling();
  } else {
    alert(data.msg);
    document.getElementById('btnStart').disabled = false;
  }
}

async function stopMonitor() {
  document.getElementById('btnStop').disabled = true;
  const res = await fetch('/api/stop', { method: 'POST' });
  const data = await res.json();
  document.getElementById('btnStart').disabled = false;
  stopPolling();
  updateStatus();
}

function startPolling() {
  if (polling) return;
  polling = setInterval(updateStatus, 2000);
  updateStatus();
}

function stopPolling() {
  if (polling) { clearInterval(polling); polling = null; }
}

async function updateStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();

    const statusEl = document.getElementById('statusText');
    if (data.running) {
      statusEl.innerHTML = '<span class="pulse pulse-green"></span>运行中';
      document.getElementById('btnStart').disabled = true;
      document.getElementById('btnStop').disabled = false;
    } else {
      statusEl.innerHTML = '<span class="pulse pulse-red"></span>已停止';
      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnStop').disabled = true;
    }

    const mins = Math.floor((data.elapsed || 0) / 60);
    document.getElementById('elapsed').textContent = mins + ' 分钟';
    const interval = data.interval || 0;
    document.getElementById('interval').textContent = Math.floor(interval / 60) + ' 分钟';
    document.getElementById('transcriptCount').textContent = data.transcript_count || 0;
    document.getElementById('summaryCount').textContent = data.summary_count || 0;
    document.getElementById('logCount').textContent = (data.logs || []).length;

    const logEl = document.getElementById('logContent');
    const logs = data.logs || [];
    logEl.innerHTML = logs.map(l =>
      `<div class="log-entry"><span class="log-time">${l.time}</span><span class="log-msg">${l.msg}</span></div>`
    ).join('');
    logEl.scrollTop = logEl.scrollHeight;
  } catch (e) {}
}

// 页面加载时检查状态
updateStatus();
</script>
</body>
</html>
